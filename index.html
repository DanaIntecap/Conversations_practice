<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Journey · Speaking Cards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<!--
  Este archivo es un MOTOR genérico: no contiene texto de la actividad.
  Todo el contenido (vocabulario, diálogos, ficha técnica) vive en un JSON
  bajo /data/units/. Para cargar otra unidad, cambia el data-unit del body
  o abre la página con ?unit=unit-05 (por ejemplo).
-->
<body data-unit="unit-04">

  <div class="page-loader" id="pageLoader">Loading activity…</div>

  <div class="container" id="app" hidden>

    <!-- Header & Logos (ajusta las rutas a tus assets reales) -->
    <div class="brand-row">
      <img class="brand-logo" src="assets/ingles-para-todos.png" alt="Logo Inglés para Todos" onerror="this.style.display='none'">
      <img class="brand-logo" src="assets/logo-intecap.png" alt="Logo Intecap" onerror="this.style.display='none'">
    </div>

    <!-- Banner (poblado por JS desde meta) -->
    <div class="banner">
      <h2 id="bannerUnit"></h2>
      <h1 id="bannerTitle"></h1>
      <h2 id="bannerSubtitle"></h2>
    </div>

    <!-- Ficha técnica colapsable (poblada por JS desde guide) -->
    <details class="guide-panel">
      <summary>📖 Ver Ficha Técnica e Instrucciones de la Actividad</summary>
      <div class="guide-body" id="guideBody"></div>
    </details>

    <!-- Instrucciones cortas de uso -->
    <div class="instructions">
      <strong>Instructions:</strong> <span id="instructionsBanner"></span>
    </div>

    <!-- Vocabulario (poblado por JS) -->
    <div class="chat-section">
      <h3>📚 New Vocabulary</h3>
      <div class="vocab-section" id="vocabSection"></div>
    </div>

    <!-- Diálogos (poblados por JS) -->
    <div id="dialoguesRoot"></div>

  </div>

  <div class="page-error" id="pageError" hidden>
    No se pudo cargar la actividad. Verifica que el archivo JSON de la unidad exista y sea válido.
  </div>

  <script src="js/app.js"></script>
</body>
</html>
